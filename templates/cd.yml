# Installed by cd-kit (https://github.com/hashorva/cd-kit) at __CD_KIT_REF__.
# Re-run the installer with --force to update; edit the inputs freely.
#
# Required check for rulesets: `gate` (one stable name). CI runs on every
# event; `gate` always runs and fails unless CI succeeded.
# Deploys: pushes to __BRANCH__ and vX.Y.Z tags (an older tag is a rollback).
# Hold deploys with the repository variable CD_DEPLOY_ENABLED=false.
# Post-deploy command: set the repository variable CD_MIGRATE_COMMAND.
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID live on the `production`
# GitHub Environment only.
name: cd

on:
  pull_request:
  push:
    branches: [__BRANCH__]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: hashorva/cd-kit/.github/workflows/ci.yml@__CD_KIT_REF__
    with:
      runs-on: '__RUNS_ON__'
      working-directory: __WORKING_DIRECTORY__

  gate:
    needs: ci
    if: always()
    runs-on: __RUNS_ON__
    timeout-minutes: 5
    steps:
      - name: Require CI success
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$CI_RESULT" != success ]; then
            echo "::error::ci finished as $CI_RESULT"
            exit 1
          fi

  deploy:
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/__BRANCH__' && vars.CD_DEPLOY_ENABLED != 'false'
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@__CD_KIT_REF__
    with:
      runs-on: '__RUNS_ON__'
      working-directory: __WORKING_DIRECTORY__
      environment: production
      production-branch: __BRANCH__

  release:
    needs: gate
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && vars.CD_DEPLOY_ENABLED != 'false'
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@__CD_KIT_REF__
    with:
      runs-on: '__RUNS_ON__'
      working-directory: __WORKING_DIRECTORY__
      environment: production

  migrate:
    needs: [deploy, release]
    if: >-
      always() && (
      (needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true') ||
      (needs.release.result == 'success' && needs.release.outputs.deployed == 'true'))
    uses: hashorva/cd-kit/.github/workflows/post-deploy.yml@__CD_KIT_REF__
    with:
      runs-on: '__RUNS_ON__'
      working-directory: __WORKING_DIRECTORY__
      environment: production
      command: ${{ vars.CD_MIGRATE_COMMAND }}
