# Reusable post-deploy hook: run one command after a successful deploy, from CI
# and in the deploy's GitHub Environment (for example a database migration).
# Migrate from CI, never inside a request.
#
# Skipped when `command` is empty (the default). The command runs with
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in its environment, read from
# the GitHub Environment, so `npx wrangler ...` works. It has its own queue,
# separate from the deploy's, and is never cancelled mid-run.
#
#   uses: hashorva/cd-kit/.github/workflows/post-deploy.yml@v0
name: post-deploy

on:
  workflow_call:
    inputs:
      command:
        description: Shell command to run after the deploy. Empty skips the job.
        type: string
        default: ""
      runs-on:
        description: >-
          JSON runner label(s). Public repos must keep the GitHub-hosted
          default. Private repos may pass e.g. '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: Directory containing package.json; the command runs here.
        type: string
        default: "."
      node-version:
        description: Node version, used when node-version-file is empty.
        type: string
        default: "24"
      node-version-file:
        description: File setup-node reads the Node version from. Takes precedence over node-version.
        type: string
        default: ""
      environment:
        description: GitHub deployment environment that holds the Cloudflare secrets.
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Optional. Defaults to the secret on the GitHub Environment.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: Optional. Defaults to the secret on the GitHub Environment.
        required: false

permissions:
  contents: read

jobs:
  run:
    if: inputs.command != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: cd-kit-post-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect package manager
        id: pm
        run: |
          if   [[ -f pnpm-lock.yaml ]]; then pm=pnpm
          elif [[ -f yarn.lock ]]; then pm=yarn
          elif [[ -f bun.lock || -f bun.lockb ]]; then pm=bun
          else pm=npm
          fi
          echo "name=$pm" >> "$GITHUB_OUTPUT"
          echo "Detected package manager: $pm"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
          cache: ${{ steps.pm.outputs.name == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.pm.outputs.name == 'npm' && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - name: Enable corepack (pnpm, yarn)
        if: steps.pm.outputs.name == 'pnpm' || steps.pm.outputs.name == 'yarn'
        run: corepack enable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pm.outputs.name == 'bun'

      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [[ "$(yarn --version)" == 1.* ]]; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
            bun)  bun install --frozen-lockfile ;;
          esac

      - name: Run command
        env:
          CMD: ${{ inputs.command }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: eval "$CMD"
